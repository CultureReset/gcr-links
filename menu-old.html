<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f6f6f6;
            color: #222;
            line-height: 1.6;
        }

        .cover {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            background: #222;
        }

        .cover-placeholder {
            width: 100%;
            height: 220px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
        }

        .business-header {
            background: #fff;
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .business-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #111;
        }

        .business-header p {
            color: #777;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .time-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-happyhour { background: #fff3cd; color: #856404; }
        .badge-after8 { background: #1a1a2e; color: #fff; }
        .badge-lunch { background: #d4edda; color: #155724; }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 0 40px 0;
        }

        .featured-section {
            background: #fff;
            margin: 16px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border: 2px solid #f0a500;
        }

        .featured-section .section-header {
            background: #f0a500;
            color: #fff;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .featured-section .section-header h2 {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-now {
            background: rgba(255,255,255,0.3);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .menu-section {
            background: #fff;
            margin: 12px 16px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
        }

        .section-header {
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .section-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #111;
        }

        .menu-item {
            padding: 14px 20px;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .menu-item:last-child { border-bottom: none; }

        .item-info { flex: 1; }

        .item-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #111;
            line-height: 1.3;
        }

        .item-description {
            font-size: 0.82rem;
            color: #888;
            margin-top: 4px;
            line-height: 1.4;
        }

        .item-price {
            font-size: 0.95rem;
            font-weight: 700;
            color: #111;
            white-space: nowrap;
            padding-top: 1px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1rem;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .business-header h1 { font-size: 1.4rem; }
            .featured-section, .menu-section { margin: 10px 12px; }
        }
    </style>
</head>
<body>

    <div id="cover-wrap"></div>

    <div class="container">
        <div id="business-header-wrap"></div>
        <div id="menu-container">
            <div class="loading">Loading menu...</div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://cybercheck-api-database.vercel.app/api/gcr';
        const SLUG = new URLSearchParams(window.location.search).get('slug') || 'icehouse-tap-room';

        // Get current hour in the business's local timezone
        // Falls back to browser local time if no timezone provided
        function getLocalHour(timezone) {
            try {
                const now = new Date();
                const formatter = new Intl.DateTimeFormat('en-US', {
                    hour: 'numeric',
                    minute: 'numeric',
                    hour12: false,
                    timeZone: timezone || Intl.DateTimeFormat().resolvedOptions().timeZone
                });
                const parts = formatter.formatToParts(now);
                const hour = parseInt(parts.find(p => p.type === 'hour').value);
                const minute = parseInt(parts.find(p => p.type === 'minute').value);
                return hour + minute / 60;
            } catch (e) {
                const now = new Date();
                return now.getHours() + now.getMinutes() / 60;
            }
        }

        function getCurrentPeriod(timezone, hhStart, hhEnd) {
            const time = getLocalHour(timezone);

            // Use API-defined happy hour times if available
            const hhStartHour = hhStart ? parseTimeToHour(hhStart) : 15;   // default 3PM
            const hhEndHour = hhEnd ? parseTimeToHour(hhEnd) : 20;         // default 8PM

            if (time >= hhStartHour && time < hhEndHour) return 'happyhour';
            if (time >= 20 || time < 3) return 'after8';
            if (time >= 11 && time < hhStartHour) return 'lunch';
            return 'normal';
        }

        function parseTimeToHour(timeStr) {
            if (!timeStr) return null;
            // handles "3:00 PM", "15:00", "3PM" etc
            const match = timeStr.match(/(\d+):?(\d*)\s*(AM|PM)?/i);
            if (!match) return null;
            let h = parseInt(match[1]);
            const m = parseInt(match[2] || '0');
            const ampm = (match[3] || '').toUpperCase();
            if (ampm === 'PM' && h < 12) h += 12;
            if (ampm === 'AM' && h === 12) h = 0;
            return h + m / 60;
        }

        const PERIOD_KEYS = {
            happyhour: ['happy_hour'],
            after8: ['after_8'],
            lunch: [],
            normal: []
        };

        const PERIOD_LABELS = {
            happyhour: { label: 'Happy Hour Now', badge: 'badge-happyhour', icon: '🍺' },
            after8: { label: 'After 8 Specials', badge: 'badge-after8', icon: '🌙' },
            lunch: { label: 'Lunch', badge: 'badge-lunch', icon: '☀️' },
            normal: { label: null, badge: null, icon: null }
        };

        async function loadMenu() {
            const container = document.getElementById('menu-container');

            try {
                const response = await fetch(`${API_BASE}/entity/${encodeURIComponent(SLUG)}`);
                if (!response.ok) throw new Error('Failed to load');

                const data = await response.json();
                const entity = data.entity;
                const sections = data.sections || [];

                if (!entity || sections.length === 0) {
                    container.innerHTML = '<div class="loading">Data coming soon</div>';
                    return;
                }

                // Cover photo
                const photos = data.photos || [];
                const coverPhoto = photos.find(p => p.is_cover) || photos[0];
                const coverWrap = document.getElementById('cover-wrap');
                if (coverPhoto && coverPhoto.image_url) {
                    coverWrap.innerHTML = `<img class="cover" src="${escapeAttr(coverPhoto.image_url)}" alt="${escapeHtml(entity.name)}">`;
                } else {
                    coverWrap.innerHTML = `<div class="cover-placeholder"></div>`;
                }

                // Determine current time period using business timezone + happy hour times
                const timezone = entity.timezone || null;
                const period = getCurrentPeriod(timezone, entity.hh_start, entity.hh_end);
                const periodInfo = PERIOD_LABELS[period];

                // Business header
                document.title = entity.name || 'Menu';
                const headerWrap = document.getElementById('business-header-wrap');
                headerWrap.innerHTML = `
                    <div class="business-header">
                        <h1>${escapeHtml(entity.name)}</h1>
                        ${entity.subtitle ? `<p>${escapeHtml(entity.subtitle)}</p>` : ''}
                        ${periodInfo.label ? `<span class="time-badge ${periodInfo.badge}">${periodInfo.icon} ${periodInfo.label}</span>` : ''}
                    </div>
                `;

                // Pin the current time period section to top
                const featuredKeys = PERIOD_KEYS[period];
                const featured = sections.filter(s => featuredKeys.includes(s.section_key));
                const rest = sections.filter(s => !featuredKeys.includes(s.section_key));
                const ordered = [...featured, ...rest];

                let html = '';

                ordered.forEach(sec => {
                    const items = sec.ungrouped_items || [];
                    if (items.length === 0) return;

                    const isFeatured = featured.includes(sec);
                    const wrapClass = isFeatured ? 'featured-section' : 'menu-section';

                    html += `<div class="${wrapClass}">`;
                    html += `<div class="section-header">`;
                    html += `<h2>${escapeHtml(sec.section_label)}</h2>`;
                    if (isFeatured) html += `<span class="badge-now">NOW</span>`;
                    html += `</div>`;

                    items.forEach(item => {
                        const price = item.price_numeric || 0;
                        html += `<div class="menu-item">`;
                        html += `<div class="item-info">`;
                        html += `<div class="item-name">${escapeHtml(item.item_name)}</div>`;
                        if (item.item_description) {
                            html += `<div class="item-description">${escapeHtml(item.item_description)}</div>`;
                        }
                        html += `</div>`;
                        if (price > 0) {
                            html += `<div class="item-price">$${price.toFixed(2)}</div>`;
                        }
                        html += `</div>`;
                    });

                    html += `</div>`;
                });

                container.innerHTML = html;

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="error">Could not load menu.</div>`;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function escapeAttr(text) {
            if (!text) return '';
            return text.replace(/"/g, '&quot;');
        }

        loadMenu();
    </script>
</body>
</html>
