<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberCheck — Set Your Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    .card-inner {
      background: #1e293b;
      border-radius: 12px;
      padding: 40px 32px;
      border: 1px solid #334155;
    }
    .logo {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      color: #3b82f6;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    h1 {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p.sub {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #3b82f6; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg {
      background: #7f1d1d;
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .success-msg {
      background: #14532d;
      color: #86efac;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .checking {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-inner">
      <div class="logo">CyberCheck</div>

      <div id="checking" class="checking">Verifying your link...</div>

      <div id="form-wrap" style="display:none">
        <h1>Set Your Password</h1>
        <p class="sub">Choose a password to access your dashboard</p>

        <div class="error-msg" id="error-msg"></div>
        <div class="success-msg" id="success-msg"></div>

        <form onsubmit="handleSubmit(event)">
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="password" placeholder="Min 6 characters" minlength="6" required>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm" placeholder="Repeat password" minlength="6" required>
          </div>
          <button type="submit" class="btn" id="submit-btn">Set Password & Go to Dashboard</button>
        </form>
      </div>

      <div id="invalid-wrap" style="display:none">
        <h1>Link Expired</h1>
        <p class="sub">This link has expired or already been used.</p>
        <br>
        <a href="signup.html" style="display:block;text-align:center;color:#3b82f6;font-size:14px;">Go to Login</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const GCR_URL = 'https://adpnhipmdefutkzzltbs.supabase.co';
    const GCR_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkcG5oaXBtZGVmdXRrenpsdGJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NjAwNzQsImV4cCI6MjA5MDQzNjA3NH0.5VdM8XRTo793rgEOBwSDjE5bbLeLYXOCI2zB93a08j8';
    const gcr = supabase.createClient(GCR_URL, GCR_ANON_KEY);

    // Supabase sends the token in the URL hash as #access_token=...&type=recovery
    (async function() {
      const hash = window.location.hash;
      const params = new URLSearchParams(hash.replace('#', ''));
      const accessToken = params.get('access_token');
      const type = params.get('type');

      if (!accessToken || type !== 'recovery') {
        // Check if already has a session (they landed here after setting password)
        const { data } = await gcr.auth.getSession();
        if (data && data.session) {
          window.location.href = 'dashboard.html';
          return;
        }
        document.getElementById('checking').style.display = 'none';
        document.getElementById('invalid-wrap').style.display = 'block';
        return;
      }

      // Set the session from the recovery token
      const { error } = await gcr.auth.setSession({ access_token: accessToken, refresh_token: params.get('refresh_token') || '' });
      if (error) {
        document.getElementById('checking').style.display = 'none';
        document.getElementById('invalid-wrap').style.display = 'block';
        return;
      }

      document.getElementById('checking').style.display = 'none';
      document.getElementById('form-wrap').style.display = 'block';
    })();

    async function handleSubmit(e) {
      e.preventDefault();
      var btn = document.getElementById('submit-btn');
      var pw = document.getElementById('password').value;
      var confirm = document.getElementById('confirm').value;

      if (pw !== confirm) {
        showError('Passwords do not match');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving...';

      var { error } = await gcr.auth.updateUser({ password: pw });
      if (error) {
        showError(error.message);
        btn.disabled = false;
        btn.textContent = 'Set Password & Go to Dashboard';
        return;
      }

      showSuccess('Password set! Taking you to your dashboard...');
      setTimeout(function() { window.location.href = 'dashboard.html'; }, 1500);
    }

    function showError(msg) {
      var el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('success-msg').style.display = 'none';
    }

    function showSuccess(msg) {
      var el = document.getElementById('success-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('error-msg').style.display = 'none';
    }
  </script>
</body>
</html>
